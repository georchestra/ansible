---
# instances need to be stopped so that the db can be removed
- name: stop instances
  service:
    name: tomcat{{ item.value.version | default(tomcat_version) }}@{{ item.key }}
    enabled: false
    state: stopped
  with_dict: "{{ tomcat_instances }}"

- name: delete georchestra main database
  become: true
  become_user: postgres
  postgresql_db:
    name: "{{ item }}"
    state: absent
  with_items:
    - "{{ georchestra.db.name }}"

- name: delete db users
  become: true
  become_user: postgres
  postgresql_user:
    name: "{{ item }}"
    state: absent
  with_items:
    - "{{ georchestra.db.user }}"

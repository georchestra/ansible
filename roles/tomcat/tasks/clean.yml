---
- name: stop instances
  service:
    name: tomcat{{ item.value.version | default(tomcat_version) }}@{{ item.key }}
    enabled: false
    state: stopped
  with_dict: "{{ tomcat_instances }}"

- name: remove tomcat directories/config
  file:
    name: "{{ item }}"
    state: absent
  with_items:
    - "{{ tomcat_basedir }}"
    - "{{ logs_basedir }}"
    - /etc/tomcat{{ tomcat_version }}/keystore

# - name: removing pkgs
#  apt:
#    pkg: "{{ item }}"
#    state: absent
#    purge: yes
#  with_items:
#  - tomcat{{ tomcat_version }}
#  - tomcat{{ tomcat_version }}-user

- name: remove init scripts & config files
  file:
    name: "{{ item[0] }}-{{ item[1] }}"
    state: absent
  with_nested:
    - - /etc/init.d/tomcat
      - /etc/default/tomcat
      - /etc/rc2.d/K01tomcat
      - /etc/rc3.d/K01tomcat
      - /etc/rc4.d/K01tomcat
      - /etc/rc5.d/K01tomcat
      - /etc/rc0.d/K01tomcat
      - /etc/rc1.d/K01tomcat
      - /etc/rc6.d/K01tomcat
    - "{{ tomcat_instances | list }}"

---
- name: Ensure python3-debian is installed for deb822 ansible module
  tags: adoptium
  apt:
    name: python3-debian
    state: present

- name: setup wtf lts repokey for tomcat9 (deb822 only available in ansible 2.15)
  tags: tomcat_apt_repo
  get_url:
    url: http://www.mirbsd.org/~tg/Debs/sources.txt/wtflts-trixie.sources
    dest: /etc/apt/sources.list.d/wtflts-trixie.sources
  when: tomcat_version == 9

- name: fetch adoptium.net repository key
  tags: adoptium
  get_url:
    dest: /etc/apt/keyrings/packages.adoptium.net.asc
    url: https://packages.adoptium.net/artifactory/api/gpg/key/public

- name: Drop previous .list repo
  tags: adoptium
  file:
    path: /etc/apt/sources.list.d/packages_adoptium_net_artifactory_deb.list
    state: absent

- name: add adoptium.net debian repo
  tags: adoptium
  deb822_repository:
    name: adoptium
    uris: https://packages.adoptium.net/artifactory/deb/
    suites: "{{ ansible_distribution_release }}"
    signed_by: /etc/apt/keyrings/packages.adoptium.net.asc
    components:
      - main

- name: install java runtimes from adoptium (only used by proxycas)
  tags: adoptium
  apt:
    pkg: temurin-17-jdk
    update_cache: yes
    state: latest

- name: set default java
  tags: adoptium
  alternatives:
    name: java
    path: /usr/lib/jvm/{{ java_version }}/bin/java

- name: installing dependencies
  tags: tomcat/pkg
  apt:
    pkg:
      - tomcat{{ tomcat_version }}
      - tomcat{{ tomcat_version }}-user # needed for create-instance script
      - tomcat9
      - tomcat9-user
      - tomcat11
      - tomcat11-user
      - tomcat-jakartaee-migration
      - libecj-java
      - libtcnative-1 # APR native libs
      - unzip # for unzipping artifacts from github actions
    state: present
    update_cache: true

- name: disable default instance
  tags: tomcat/disable_default
  service:
    name: tomcat{{ tomcat_version }}
    state: stopped
    enabled: false
  vars:
    tomcat_version: "{{ item }}"
  with_items:
    - 9
    - 10
    - 11

- name: list existing services
  tags: tomcat/disable_old_tomcat
  ansible.builtin.service_facts:

- name: ensure previous non-versioned tomcat service arent enabled/running
  tags: tomcat/disable_old_tomcat
  ansible.builtin.service:
    enabled: false
    state: stopped
    name: tomcat@{{ item.key }}
  when: ansible_facts['services'][service_name]['status'] | default('not-found') != 'not-found'
  vars:
    service_name: 'tomcat@{{ item.key }}.service'
  with_dict: "{{ tomcat_instances }}"

- name: link tomcat9 to 10 migration jar
  file:
    src: /usr/share/tomcat-jakartaee-migration/lib/jakartaee-migration-shaded.jar
    dest: /usr/share/tomcat10/lib/jakartaee-migration-shaded.jar
    state: link
  when: tomcat_version == 10

- name: link ecj jar for JSP pages compilation
  tags: jspfix
  file:
    src: ../../java/ecj.jar
    dest: /usr/share/tomcat9/lib/ecj.jar
    state: link

- name: template tmpfiles.d for pidfile
  tags: systemd_unit
  template:
    src: tomcat.conf.j2
    dest: /etc/tmpfiles.d/tomcat.conf
  register: tomcat_piddir

- name: add fqdn to /etc/hosts
  lineinfile:
    dest: /etc/hosts
    line: 127.0.0.1 {{ georchestra.fqdn }}

- name: create temp dir
  tags: systemd_unit
  command: systemd-tmpfiles  --prefix=/run/tomcat --create
  when: tomcat_piddir.changed

- name: template systemd unit for tomcat
  tags: systemd_unit
  template:
    src: tomcat.service.j2
    dest: /etc/systemd/system/tomcat{{ tomcat_version }}@.service
  vars:
    tomcat_version: "{{ item }}"
  with_items:
    - 9
    - 10
    - 11

- name: reload systemd so that it finds the new units
  tags: systemd_unit
  systemd:
    daemon-reload: true

- name: create tomcat_basedir
  file:
    name: "{{ tomcat_basedir }}"
    state: directory

- name: create common logdir
  file:
    path: "{{ logs_basedir }}"
    state: directory
    owner: tomcat
    group: tomcat
